services:
  compras-api:
    build: .
    image: compras-api:local
    container_name: compras-api
    environment:
      APP_ENV: production
      APP_PORT: ${APP_PORT:-3001}
      CSV_PATH: /data/compras.csv
    ports:
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"
    volumes:
      - ./compras.csv:/data/compras.csv:ro
    restart: unless-stopped